name: Validate repository

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate structure and metadata
        run: scripts/validate

      - name: Verify skills CLI discovery
        if: ${{ hashFiles('skills/*/SKILL.md') != '' }}
        run: npx --yes skills@1.5.23 add . --list
